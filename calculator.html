<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 1.0</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" type="image/x-icon" href="/calculator/calculator.png"
    
</head>
<body>
    <div class="container">
        <!--Dark Mode Button-->
        <div class="dark-mode-main-div" id="darkMode">
            <div class="dark-mode">
                Dark Mode
            </div>
        </div>
        <div class="calculator-main-div">
            <!--Calculator Div-->
            <div class="calculator">
                <!--Heading Div-->
                <div class="heading">
                    <h2>Calculator</h2>
                </div>
                <!--Display-->
                <div class="calculator-display">
                    <h1 id="calculatorDisplay">0</h1>
                </div>
                <!--Buttons-->
                <div class="buttons-rows">
                    <div class="buttons-row-1">
                        <button class="calculator-button" id="seven">7</button>
                        <button class="calculator-button" id="eight">8</button>
                        <button class="calculator-button" id="nine">9</button>
                        <button class="calculator-button" id="plus">+</button>
                    </div>
                    <div class="buttons-row-2">
                        <button class="calculator-button" id="four">4</button>
                        <button class="calculator-button" id="five">5</button>
                        <button class="calculator-button" id="six">6</button>
                        <button class="calculator-button" id="minus">-</button>
                    </div>
                    <div class="buttons-row-3">
                        <button class="calculator-button" id="one">1</button>
                        <button class="calculator-button" id="two">2</button>
                        <button class="calculator-button" id="three">3</button>
                        <button class="calculator-button" id="multiply">*</button>
                    </div>
                    <div class="buttons-row-4">
                        <button class="calculator-button" id="zero">0</button>
                        <button class="calculator-button" id="clear">C</button>
                        <button class="calculator-button" id="equal">=</button>
                        <button class="calculator-button" id="divide">/</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>

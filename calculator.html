<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator 1.0</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" type="image/x-icon" href="/calculator/calculator-3.png">
</head>
<body>
    <!--Calculator Div-->
    <div class="calculator">
        <!--Heading Div-->
        <div class="heading">
            <h2>Calculator</h2>
        </div>
        <!--Display-->
        <div class="calculator-display">
            <h1 id="calculatorDisplay">0</h1>
        </div>
        <!--Buttons-->
        <div class="buttons-rows">
            <div class="buttons-row-1">
                <button id="seven">7</button>
                <button id="eight">8</button>
                <button id="nine">9</button>
                <button id="plus">+</button>
            </div>
            <div class="buttons-row-2">
                <button id="four">4</button>
                <button id="five">5</button>
                <button id="six">6</button>
                <button id="minus">-</button>
            </div>
            <div class="buttons-row-3">
                <button id="one">1</button>
                <button id="two">2</button>
                <button id="three">3</button>
                <button id="multiply">*</button>
            </div>
            <div class="buttons-row-4">
                <button id="zero">0</button>
                <button id="clear">C</button>
                <button id="equal">=</button>
                <button id="divide">/</button>
            </div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
